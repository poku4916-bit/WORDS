<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="1350" viewBox="0 0 1760 1350">
  <title>WORDS. 前端视觉设计板</title>
  <desc>暖白、深墨和森林绿的编辑式词典方向。左侧展示桌面查词，右侧展示手机学习，底部为色彩与字体。全部数据为概念示例。</desc>
  <defs>
